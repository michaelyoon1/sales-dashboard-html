<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TENKI Prediction Results</title>
  <style>
    :root {
      --bg: #f5f7f8;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #667085;
      --line: #d9e0e7;
      --soft-line: #edf1f4;
      --known: #0f766e;
      --final: #2563eb;
      --final-soft: rgba(37, 99, 235, 0.16);
      --missing: #7c3aed;
      --interval: #344054;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(245, 247, 248, 0.96);
      backdrop-filter: blur(8px);
    }

    .header-inner,
    main {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 14px 18px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    h1,
    h2 {
      margin: 0;
      line-height: 1.2;
    }

    h1 { font-size: 22px; }
    h2 { font-size: 16px; }

    .source-name,
    .status,
    .panel-meta,
    .note {
      color: var(--muted);
      font-size: 13px;
    }

    .source-name { margin-top: 4px; }

    .controls {
      display: grid;
      grid-template-columns: minmax(260px, 1.8fr) auto minmax(150px, 0.8fr) minmax(150px, 0.8fr) minmax(150px, 0.8fr) minmax(120px, 0.6fr);
      gap: 12px;
      align-items: end;
      margin: 12px 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .field span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    select,
    input[type="date"] {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
    }

    select:focus,
    input[type="date"]:focus {
      border-color: rgba(37, 99, 235, 0.48);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      outline: 0;
    }

    .segmented {
      display: inline-grid;
      grid-auto-flow: column;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    .segmented button {
      min-height: 38px;
      border: 0;
      border-right: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      padding: 8px 12px;
      cursor: pointer;
    }

    .segmented button:last-child { border-right: 0; }
    .segmented button.active { background: var(--ink); color: #fff; }

    body[data-date-mode="single"] .range-field,
    body[data-date-mode="single"] .range-only {
      display: none;
    }

    body[data-date-mode="range"] #singleDateField {
      display: none;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .summary-item,
    .chart-panel,
    .table-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .summary-item {
      min-width: 0;
      padding: 12px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .summary-value {
      margin-top: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 22px;
      font-weight: 700;
    }

    .chart-panel,
    .table-panel {
      margin-bottom: 12px;
      padding: 14px;
    }

    .panel-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .swatch {
      display: inline-block;
      width: 14px;
      height: 8px;
      border-radius: 3px;
    }

    .swatch.final { background: var(--final); }
    .swatch.known { background: var(--known); }
    .swatch.missing { background: var(--missing); }
    .swatch.interval {
      background: var(--final-soft);
      border: 1px solid rgba(37, 99, 235, 0.24);
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      height: 420px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    canvas.is-hovering { cursor: crosshair; }
    canvas.is-clickable { cursor: pointer; }

    .chart-tooltip {
      position: absolute;
      z-index: 5;
      min-width: 180px;
      max-width: min(300px, calc(100vw - 40px));
      border: 1px solid rgba(31, 41, 51, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 12px 32px rgba(16, 24, 40, 0.16);
      color: var(--ink);
      padding: 9px 10px;
      pointer-events: none;
      transform: translate(-50%, calc(-100% - 12px));
    }

    .tooltip-title {
      font-size: 12px;
      font-weight: 700;
    }

    .tooltip-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .tooltip-row strong {
      color: var(--ink);
      font-weight: 700;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      border-bottom: 1px solid var(--soft-line);
      padding: 8px 9px;
      text-align: right;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    th:first-child,
    td:first-child,
    th:nth-child(7),
    td:nth-child(7) {
      text-align: left;
    }

    .empty-state {
      display: grid;
      min-height: 180px;
      place-items: center;
      color: var(--muted);
      font-weight: 700;
    }

    @media (max-width: 1040px) {
      .controls { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .genre-field { grid-column: 1 / -1; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      .header-inner,
      .panel-header {
        display: grid;
      }

      .controls,
      .summary-grid {
        grid-template-columns: 1fr;
      }

      .legend { justify-content: flex-start; }
      .canvas-wrap { height: 360px; }
    }
  </style>
</head>
<body data-date-mode="range">
  <header class="app-header">
    <div class="header-inner">
      <div>
        <h1>Total Rakuten Prediction Results</h1>
        <div class="source-name">Known TENKI ranked sales plus modeled missing ranked sales</div>
      </div>
      <div class="status" id="status">Loading</div>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Prediction result filters">
      <label class="field genre-field">
        <span>Genre</span>
        <select id="genreSelect"></select>
      </label>

      <div class="field mode-field">
        <span>Dates</span>
        <div class="segmented" id="dateModeControls" role="group" aria-label="Date mode">
          <button type="button" data-mode="single">Single Day</button>
          <button type="button" data-mode="range">Range</button>
        </div>
      </div>

      <label class="field date-field" id="singleDateField">
        <span>Day</span>
        <input type="date" id="singleDateInput">
      </label>

      <label class="field date-field range-field">
        <span>Start</span>
        <input type="date" id="startDateInput">
      </label>

      <label class="field date-field range-field">
        <span>End</span>
        <input type="date" id="endDateInput">
      </label>

      <label class="field rank-field">
        <span>Rank</span>
        <select id="rankSelect"></select>
      </label>
    </section>

    <section class="summary-grid" id="summaryGrid" aria-label="Selected summary"></section>

    <section class="chart-panel range-only" id="totalChartPanel">
      <div class="panel-header">
        <div>
          <h2>Total Sales</h2>
          <div class="panel-meta" id="totalChartMeta"></div>
        </div>
        <div class="legend">
          <span><i class="swatch final"></i>Final Estimate</span>
          <span><i class="swatch interval"></i>Validation Error Band</span>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="totalChart"></canvas>
      </div>
    </section>

    <section class="chart-panel" id="rankChartPanel">
      <div class="panel-header">
        <div>
          <h2>Sales by Rank</h2>
          <div class="panel-meta" id="rankChartMeta"></div>
        </div>
        <div class="legend">
          <span><i class="swatch final"></i>Rank Profile Estimate</span>
          <span><i class="swatch interval"></i>Validation Error Band</span>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="rankChart"></canvas>
      </div>
    </section>

    <section class="chart-panel range-only" id="timeChartPanel">
      <div class="panel-header">
        <div>
          <h2>Rank Over Time</h2>
          <div class="panel-meta" id="timeChartMeta"></div>
        </div>
        <div class="legend">
          <span><i class="swatch final"></i>Selected Rank Estimate</span>
          <span><i class="swatch interval"></i>Validation Error Band</span>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="timeChart"></canvas>
      </div>
    </section>

    <section class="table-panel">
      <div class="panel-header">
        <div>
          <h2>Daily Totals</h2>
          <div class="panel-meta" id="tableMeta"></div>
        </div>
      </div>
      <div class="table-wrap">
        <table id="rowsTable"></table>
      </div>
    </section>
  </main>

  <script src="top_items_daily_data.js?v=genre-sales-rebuild-20260611"></script>
  <script src="projected_market_data.js?v=hidden-holdout-5trials-20260610"></script>
  <script>
    const topData = window.TOP_ITEMS_DAILY_DATA || { genres: [], dailyTotals: [] };
    const modelData = window.PROJECTED_MARKET_DATA || { daily: [], rankCurve: [], method: {} };
    const ALL_GENRES = "__all__";
    const colors = {
      final: "#2563eb",
      finalSoft: "rgba(37, 99, 235, 0.16)",
      known: "#0f766e",
      missing: "#7c3aed",
      interval: "#344054",
      ink: "#1f2933",
      muted: "#667085",
      line: "#d9e0e7",
      softLine: "#edf1f4",
      panel: "#ffffff"
    };

    const fmtYen = new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY", maximumFractionDigits: 0 });
    const fmtNum = new Intl.NumberFormat("en-US");
    const fmtPct = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });
    const chartState = new Map();
    const state = {
      genre: new URLSearchParams(location.search).get("genre") || ALL_GENRES,
      mode: new URLSearchParams(location.search).get("mode") === "single" ? "single" : "range",
      singleDate: new URLSearchParams(location.search).get("date") || "",
      startDate: new URLSearchParams(location.search).get("start") || "",
      endDate: new URLSearchParams(location.search).get("end") || "",
      rank: new URLSearchParams(location.search).get("rank") || "1"
    };

    const projectedByGenre = new Map();
    const sourceByGenre = new Map();

    for (const row of modelData.daily || []) {
      if (!projectedByGenre.has(row.genre)) projectedByGenre.set(row.genre, []);
      projectedByGenre.get(row.genre).push(row);
    }
    for (const rows of projectedByGenre.values()) rows.sort((a, b) => a.date.localeCompare(b.date));

    for (const row of topData.dailyTotals || []) {
      if (!sourceByGenre.has(row.genre)) sourceByGenre.set(row.genre, []);
      sourceByGenre.get(row.genre).push(row);
    }

    function el(id) {
      return document.getElementById(id);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function compact(value, digits = 1) {
      const numberValue = Number(value);
      if (!Number.isFinite(numberValue)) return "-";
      return new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: digits }).format(numberValue);
    }

    function number(value, digits = 0) {
      const numberValue = Number(value);
      if (!Number.isFinite(numberValue)) return "-";
      return new Intl.NumberFormat("en-US", { maximumFractionDigits: digits }).format(numberValue);
    }

    function genreName(genre) {
      if (genre === ALL_GENRES) return "All Genres";
      return topData.genres.find(row => row.genre === genre)?.name || `Genre ${genre}`;
    }

    function allProjectedRows() {
      const map = new Map();
      for (const row of modelData.daily || []) {
        if (!map.has(row.date)) {
          map.set(row.date, {
            date: row.date,
            observedSales: 0,
            projectedMissingSales: 0,
            projectedTotalSales: 0,
            rankedRows: 0,
            observedRows: 0,
            projectedRows: 0,
            eventTypeCount: 0
          });
        }
        const bucket = map.get(row.date);
        bucket.observedSales += row.observedSales || 0;
        bucket.projectedMissingSales += row.projectedMissingSales || 0;
        bucket.projectedTotalSales += row.projectedTotalSales || 0;
        bucket.rankedRows += row.rankedRows || 0;
        bucket.observedRows += row.observedRows || 0;
        bucket.projectedRows += row.projectedRows || 0;
        bucket.eventTypeCount += row.eventTypeCount || 0;
      }
      return [...map.values()].sort((a, b) => a.date.localeCompare(b.date));
    }

    function rowsForGenre(genre) {
      return genre === ALL_GENRES ? allProjectedRows() : (projectedByGenre.get(genre) || []);
    }

    function sourceRowsForGenre(genre) {
      if (genre !== ALL_GENRES) return sourceByGenre.get(genre) || [];
      const map = new Map();
      for (const row of topData.dailyTotals || []) {
        if (!map.has(row.date)) map.set(row.date, { date: row.date, sales: 0, itemCount: 0 });
        const bucket = map.get(row.date);
        bucket.sales += row.sales || 0;
        bucket.itemCount += row.itemCount || 0;
      }
      return [...map.values()].sort((a, b) => a.date.localeCompare(b.date));
    }

    function dateRangeForGenre(genre) {
      const rows = rowsForGenre(genre);
      if (!rows.length) return { start: "", end: "" };
      return { start: rows[0].date, end: rows[rows.length - 1].date };
    }

    function setDefaults() {
      if (!topData.genres.some(row => row.genre === state.genre) && state.genre !== ALL_GENRES) state.genre = ALL_GENRES;
      const range = dateRangeForGenre(state.genre);
      if (!state.singleDate) state.singleDate = range.end;
      if (!state.startDate) state.startDate = range.start;
      if (!state.endDate) state.endDate = range.end;
    }

    function activeRange() {
      let start = state.mode === "single" ? state.singleDate : state.startDate;
      let end = state.mode === "single" ? state.singleDate : state.endDate;
      if (start && end && start > end) [start, end] = [end, start];
      return { start, end };
    }

    function filteredRows() {
      const { start, end } = activeRange();
      return rowsForGenre(state.genre).filter(row => (!start || row.date >= start) && (!end || row.date <= end));
    }

    function summarize(rows) {
      const total = rows.reduce((sum, row) => sum + (row.projectedTotalSales || 0), 0);
      const known = rows.reduce((sum, row) => sum + (row.observedSales || 0), 0);
      const missing = rows.reduce((sum, row) => sum + (row.projectedMissingSales || 0), 0);
      const rankedRows = rows.reduce((sum, row) => sum + (row.rankedRows || 0), 0);
      return { total, known, missing, rankedRows, avgDaily: rows.length ? total / rows.length : 0 };
    }

    function validationBand(value) {
      const wmape = modelData.method?.validation?.wmape || 0.4318;
      return {
        lo95: Math.max(0, value * (1 - wmape)),
        hi95: value * (1 + wmape)
      };
    }

    function withChartFields(rows) {
      return rows.map(row => {
        const final = row.projectedTotalSales || 0;
        const band = validationBand(final);
        return {
          ...row,
          final,
          known: row.observedSales || 0,
          imputed: row.projectedMissingSales || 0,
          lo95: band.lo95,
          hi95: band.hi95
        };
      });
    }

    function rankWeights() {
      const curve = (modelData.rankCurve || []).filter(row => row.rank >= 1 && row.rank <= 80);
      const values = curve.map(row => ({
        rank: row.rank,
        weight: Math.max(row.avgObservedSales || row.medianObservedSales || 1, 1)
      }));
      const total = values.reduce((sum, row) => sum + row.weight, 0) || 1;
      return values.map(row => ({ rank: row.rank, weight: row.weight / total }));
    }

    function rankRowsForTotal(total) {
      return rankWeights().map(row => {
        const final = total * row.weight;
        const band = validationBand(final);
        return {
          rank: row.rank,
          final,
          lo95: band.lo95,
          hi95: band.hi95,
          rows: 1
        };
      });
    }

    function selectedRankRows(rows) {
      const weight = rankWeights().find(row => String(row.rank) === String(state.rank))?.weight || 0;
      return withChartFields(rows).map(row => {
        const final = row.final * weight;
        const band = validationBand(final);
        return {
          date: row.date,
          final,
          lo95: band.lo95,
          hi95: band.hi95
        };
      });
    }

    function renderSummary(rows) {
      const summary = summarize(rows);
      const coveragePct = summary.total ? summary.known * 100 / summary.total : 0;
      const cards = [
        ["Days", number(rows.length)],
        ["Final Estimate", fmtYen.format(summary.total)],
        ["Known TENKI", fmtYen.format(summary.known)],
        ["Modeled Missing", fmtYen.format(summary.missing)],
        ["Known Share", `${fmtPct.format(coveragePct)}%`]
      ];
      el("summaryGrid").innerHTML = cards.map(([label, value]) => `
        <div class="summary-item">
          <div class="summary-label">${escapeHtml(label)}</div>
          <div class="summary-value">${escapeHtml(value)}</div>
        </div>
      `).join("");
    }

    function setupCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      const width = Math.max(320, Math.floor(rect.width));
      const height = Math.max(260, Math.floor(rect.height));
      canvas.width = Math.floor(width * scale);
      canvas.height = Math.floor(height * scale);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, width, height);
      ctx.font = "12px Arial, Helvetica, sans-serif";
      return { ctx, width, height };
    }

    function niceMax(value) {
      if (!Number.isFinite(value) || value <= 0) return 1;
      const power = Math.pow(10, Math.floor(Math.log10(value)));
      const ratio = value / power;
      const step = ratio <= 1 ? 1 : ratio <= 2 ? 2 : ratio <= 5 ? 5 : 10;
      return step * power;
    }

    function drawEmpty(canvasId, message) {
      const { ctx, width, height } = setupCanvas(el(canvasId));
      ctx.fillStyle = colors.panel;
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = colors.muted;
      ctx.font = "700 14px Arial, Helvetica, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(message, width / 2, height / 2);
      chartState.delete(canvasId);
    }

    function drawYAxis(ctx, dims, yMax) {
      ctx.strokeStyle = colors.line;
      ctx.beginPath();
      ctx.moveTo(dims.left, dims.top);
      ctx.lineTo(dims.left, dims.bottom);
      ctx.lineTo(dims.right, dims.bottom);
      ctx.stroke();
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = colors.muted;
      for (let i = 0; i <= 4; i += 1) {
        const value = (yMax / 4) * i;
        const y = dims.bottom - (dims.plotH * i) / 4;
        ctx.strokeStyle = i === 0 ? colors.line : colors.softLine;
        ctx.beginPath();
        ctx.moveTo(dims.left, y);
        ctx.lineTo(dims.right, y);
        ctx.stroke();
        ctx.fillText(compact(value), dims.left - 8, y);
      }
    }

    function drawLineChart(canvasId, rows, options = {}) {
      if (!rows.length) return drawEmpty(canvasId, "No rows in this selection");
      const canvas = el(canvasId);
      const previous = chartState.get(canvasId) || {};
      const hoverIndex = previous.hoverIndex ?? -1;
      const { ctx, width, height } = setupCanvas(canvas);
      const dims = { left: 74, right: width - 18, top: 18, bottom: height - 48 };
      dims.plotW = dims.right - dims.left;
      dims.plotH = dims.bottom - dims.top;
      const points = rows.slice().sort((a, b) => a.date.localeCompare(b.date)).map(row => ({ ...row, ms: new Date(`${row.date}T00:00:00`).getTime() }));
      const xMin = Math.min(...points.map(row => row.ms));
      const xMax = Math.max(...points.map(row => row.ms));
      const xSpan = Math.max(1, xMax - xMin);
      const yMax = niceMax(Math.max(...points.flatMap(row => [row.final, row.hi95])) * 1.08);
      const x = ms => dims.left + ((ms - xMin) / xSpan) * dims.plotW;
      const y = value => dims.bottom - (Math.max(0, value) / yMax) * dims.plotH;
      const hits = points.map((row, index) => ({ index, cx: x(row.ms), cy: y(row.final), data: row }));
      drawYAxis(ctx, dims, yMax);

      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillStyle = colors.muted;
      const ticks = points.length === 1 ? 1 : Math.min(6, Math.max(2, Math.floor(dims.plotW / 140)));
      for (let i = 0; i < ticks; i += 1) {
        const ratio = ticks === 1 ? 0 : i / (ticks - 1);
        const ms = xMin + (xMax - xMin) * ratio;
        ctx.fillText(new Date(ms).toISOString().slice(0, 10), dims.left + dims.plotW * ratio, dims.bottom + 9);
      }

      if (points.length > 1) {
        ctx.fillStyle = colors.finalSoft;
        ctx.beginPath();
        points.forEach((row, index) => {
          const px = x(row.ms);
          const py = y(row.hi95);
          if (index === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        points.slice().reverse().forEach(row => ctx.lineTo(x(row.ms), y(row.lo95)));
        ctx.closePath();
        ctx.fill();
      }

      ctx.strokeStyle = colors.final;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      points.forEach((row, index) => {
        const px = x(row.ms);
        const py = y(row.final);
        if (index === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();
      ctx.lineWidth = 1;

      const pointStep = Math.max(1, Math.ceil(points.length / 180));
      points.forEach((row, index) => {
        if (index % pointStep !== 0 && index !== points.length - 1) return;
        ctx.fillStyle = colors.final;
        ctx.beginPath();
        ctx.arc(x(row.ms), y(row.final), 2.4, 0, Math.PI * 2);
        ctx.fill();
      });

      const hovered = hits[hoverIndex];
      if (hovered) {
        ctx.strokeStyle = colors.ink;
        ctx.globalAlpha = 0.32;
        ctx.beginPath();
        ctx.moveTo(hovered.cx, dims.top);
        ctx.lineTo(hovered.cx, dims.bottom);
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = colors.panel;
        ctx.strokeStyle = colors.ink;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(hovered.cx, hovered.cy, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.lineWidth = 1;
      }

      chartState.set(canvasId, { type: "line", hits, rows, redraw: () => drawLineChart(canvasId, rows, options), click: options.click });
    }

    function drawRankChart(items) {
      if (!items.length) return drawEmpty("rankChart", "No rank rows in this selection");
      const canvasId = "rankChart";
      const canvas = el(canvasId);
      const previous = chartState.get(canvasId) || {};
      const hoverIndex = previous.hoverIndex ?? -1;
      const { ctx, width, height } = setupCanvas(canvas);
      const dims = { left: 74, right: width - 18, top: 18, bottom: height - 44 };
      dims.plotW = dims.right - dims.left;
      dims.plotH = dims.bottom - dims.top;
      const yMax = niceMax(Math.max(...items.flatMap(row => [row.final, row.hi95])) * 1.08);
      const y = value => dims.bottom - (Math.max(0, value) / yMax) * dims.plotH;
      drawYAxis(ctx, dims, yMax);
      const band = dims.plotW / Math.max(1, items.length);
      const barW = Math.max(3, Math.min(16, band * 0.45));
      const labelStep = Math.max(1, Math.ceil(items.length / 14));
      const hits = [];

      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      items.forEach((row, index) => {
        const center = dims.left + band * index + band / 2;
        const barX = center - barW / 2;
        const barY = y(row.final);
        ctx.fillStyle = colors.final;
        ctx.fillRect(barX, barY, barW, Math.max(1, dims.bottom - barY));
        ctx.strokeStyle = colors.interval;
        ctx.beginPath();
        ctx.moveTo(center, y(row.hi95));
        ctx.lineTo(center, y(row.lo95));
        ctx.stroke();
        if (index === hoverIndex) {
          ctx.strokeStyle = colors.ink;
          ctx.lineWidth = 2;
          ctx.strokeRect(barX - 2, barY - 2, barW + 4, dims.bottom - barY + 4);
          ctx.lineWidth = 1;
        }
        if (index % labelStep === 0 || index === items.length - 1) {
          ctx.fillStyle = colors.muted;
          ctx.fillText(String(row.rank), center, dims.bottom + 9);
        }
        hits.push({ index, cx: center, cy: barY, x: barX, width: barW, top: barY, bottom: dims.bottom, data: row });
      });
      chartState.set(canvasId, {
        type: "bar",
        hits,
        band,
        redraw: () => drawRankChart(items),
        click: hit => {
          state.rank = String(hit.data.rank);
          syncInputs();
          render();
        }
      });
    }

    function tooltipRow(label, value) {
      return `<div class="tooltip-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`;
    }

    function tooltipHtml(row) {
      if ("rank" in row) {
        return [
          `<div class="tooltip-title">Rank ${escapeHtml(row.rank)}</div>`,
          tooltipRow("Estimate", fmtYen.format(row.final)),
          tooltipRow("Band", `${fmtYen.format(row.lo95)} - ${fmtYen.format(row.hi95)}`)
        ].join("");
      }
      return [
        `<div class="tooltip-title">${escapeHtml(row.date)}</div>`,
        tooltipRow("Final estimate", fmtYen.format(row.final)),
        tooltipRow("Known TENKI", fmtYen.format(row.known || 0)),
        tooltipRow("Modeled missing", fmtYen.format(row.imputed || 0)),
        tooltipRow("Band", `${fmtYen.format(row.lo95)} - ${fmtYen.format(row.hi95)}`)
      ].join("");
    }

    function tooltipFor(canvas) {
      let tooltip = canvas.parentElement.querySelector(".chart-tooltip");
      if (!tooltip) {
        tooltip = document.createElement("div");
        tooltip.className = "chart-tooltip";
        tooltip.hidden = true;
        canvas.parentElement.appendChild(tooltip);
      }
      return tooltip;
    }

    function canvasPoint(event, canvas) {
      const rect = canvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    function findHit(chart, point) {
      if (!chart?.hits?.length) return null;
      if (chart.type === "bar") {
        const bar = chart.hits.find(hit => point.x >= hit.x - 4 && point.x <= hit.x + hit.width + 4 && point.y >= hit.top - 8 && point.y <= hit.bottom + 8);
        if (bar) return bar;
      }
      const nearest = chart.hits.reduce((best, hit) => {
        const distance = Math.hypot(point.x - hit.cx, point.y - hit.cy);
        return !best || distance < best.distance ? { ...hit, distance } : best;
      }, null);
      const limit = chart.type === "bar" ? Math.max(18, chart.band / 2) : 28;
      return nearest && nearest.distance <= limit ? nearest : null;
    }

    function handlePointerMove(event) {
      const canvas = event.currentTarget;
      const chart = chartState.get(canvas.id);
      const hit = findHit(chart, canvasPoint(event, canvas));
      const nextIndex = hit ? hit.index : -1;
      if (chart && chart.hoverIndex !== nextIndex) {
        chart.hoverIndex = nextIndex;
        chart.redraw?.();
      }
      canvas.classList.toggle("is-hovering", Boolean(hit));
      canvas.classList.toggle("is-clickable", Boolean(hit && chart?.click));
      const tooltip = tooltipFor(canvas);
      if (!hit) {
        tooltip.hidden = true;
        return;
      }
      tooltip.innerHTML = tooltipHtml(hit.data);
      tooltip.style.left = `${Math.max(14, Math.min(canvas.parentElement.clientWidth - 14, hit.cx))}px`;
      tooltip.style.top = `${Math.max(42, hit.cy)}px`;
      tooltip.hidden = false;
    }

    function handlePointerLeave(event) {
      const canvas = event.currentTarget;
      const chart = chartState.get(canvas.id);
      if (chart) {
        chart.hoverIndex = -1;
        chart.redraw?.();
      }
      const tooltip = canvas.parentElement?.querySelector(".chart-tooltip");
      if (tooltip) tooltip.hidden = true;
      canvas.classList.remove("is-hovering", "is-clickable");
    }

    function handleClick(event) {
      const canvas = event.currentTarget;
      const chart = chartState.get(canvas.id);
      if (!chart?.click) return;
      const hit = findHit(chart, canvasPoint(event, canvas));
      if (hit) chart.click(hit);
    }

    function renderTable(rows) {
      const sorted = withChartFields(rows).slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 120);
      el("tableMeta").textContent = rows.length ? `${number(rows.length)} selected days | showing ${number(sorted.length)} latest` : "No days";
      if (!sorted.length) {
        el("rowsTable").innerHTML = `<tbody><tr><td><div class="empty-state">No days in this selection</div></td></tr></tbody>`;
        return;
      }
      const columns = [
        ["date", "Date"],
        ["final", "Final Estimate", fmtYen.format],
        ["known", "Known TENKI", fmtYen.format],
        ["imputed", "Modeled Missing", fmtYen.format],
        ["rankedRows", "Ranked Rows", number],
        ["observedRows", "Known Rows", number],
        ["projectedRows", "Missing Rows", number]
      ];
      const head = `<thead><tr>${columns.map(([, label]) => `<th>${escapeHtml(label)}</th>`).join("")}</tr></thead>`;
      const body = sorted.map(row => {
        const cells = columns.map(([key, , formatter]) => `<td>${escapeHtml(formatter ? formatter(row[key] || 0) : row[key])}</td>`).join("");
        return `<tr>${cells}</tr>`;
      }).join("");
      el("rowsTable").innerHTML = `${head}<tbody>${body}</tbody>`;
    }

    function populateControls() {
      const total = (modelData.daily || []).reduce((sum, row) => sum + (row.projectedTotalSales || 0), 0);
      const options = topData.genres
        .map(genre => ({ ...genre, estimate: (projectedByGenre.get(genre.genre) || []).reduce((sum, row) => sum + (row.projectedTotalSales || 0), 0) }))
        .sort((a, b) => b.estimate - a.estimate)
        .map(genre => `<option value="${escapeHtml(genre.genre)}">${escapeHtml(genre.name)} (${escapeHtml(genre.genre)}) - ${compact(genre.estimate)}</option>`)
        .join("");
      el("genreSelect").innerHTML = `<option value="${ALL_GENRES}">All Genres - ${compact(total)}</option>${options}`;
      el("rankSelect").innerHTML = Array.from({ length: 80 }, (_, index) => index + 1).map(rank => `<option value="${rank}">${rank}</option>`).join("");
    }

    function syncInputs() {
      document.body.dataset.dateMode = state.mode;
      el("genreSelect").value = state.genre;
      el("singleDateInput").value = state.singleDate;
      el("startDateInput").value = state.startDate;
      el("endDateInput").value = state.endDate;
      el("rankSelect").value = state.rank;
      document.querySelectorAll("#dateModeControls button").forEach(button => {
        button.classList.toggle("active", button.dataset.mode === state.mode);
        button.setAttribute("aria-pressed", button.dataset.mode === state.mode ? "true" : "false");
      });
      const range = dateRangeForGenre(state.genre);
      for (const id of ["singleDateInput", "startDateInput", "endDateInput"]) {
        el(id).min = range.start;
        el(id).max = range.end;
      }
    }

    function updateUrl() {
      const params = new URLSearchParams();
      if (state.genre !== ALL_GENRES) params.set("genre", state.genre);
      if (state.mode === "single") {
        params.set("mode", "single");
        if (state.singleDate) params.set("date", state.singleDate);
      } else {
        if (state.startDate) params.set("start", state.startDate);
        if (state.endDate) params.set("end", state.endDate);
      }
      if (state.rank !== "1") params.set("rank", state.rank);
      history.replaceState(null, "", `${location.pathname}${params.toString() ? `?${params}` : ""}`);
    }

    function resetDatesForGenre() {
      const range = dateRangeForGenre(state.genre);
      state.singleDate = range.end;
      state.startDate = range.start;
      state.endDate = range.end;
    }

    function render() {
      syncInputs();
      updateUrl();
      const rows = filteredRows();
      const chartRows = withChartFields(rows);
      const summary = summarize(rows);
      const rankRows = rankRowsForTotal(summary.total);
      const rankLineRows = selectedRankRows(rows);
      const label = genreName(state.genre);
      const range = activeRange();
      const rangeLabel = range.start === range.end ? range.start : `${range.start} to ${range.end}`;
      renderSummary(rows);
      if (state.mode === "range") {
        drawLineChart("totalChart", chartRows, {
          click: hit => {
            state.mode = "single";
            state.singleDate = hit.data.date;
            render();
          }
        });
        drawLineChart("timeChart", rankLineRows);
      } else {
        chartState.delete("totalChart");
        chartState.delete("timeChart");
      }
      drawRankChart(rankRows);
      renderTable(rows);
      el("totalChartMeta").textContent = `${label} | ${rangeLabel} | ${number(rows.length)} days`;
      el("rankChartMeta").textContent = `${label} | ${rangeLabel} | scaled from model rank curve`;
      el("timeChartMeta").textContent = `${label} rank ${state.rank} | ${rangeLabel}`;
      const validation = modelData.method?.validation || {};
      el("status").textContent = `${label} | WMAPE ${validation.wmape ? fmtPct.format(validation.wmape * 100) + "%" : "-"} | ${number(rows.length)} days`;
    }

    function bindControls() {
      el("genreSelect").addEventListener("change", event => {
        state.genre = event.target.value;
        resetDatesForGenre();
        render();
      });
      document.querySelectorAll("#dateModeControls button").forEach(button => {
        button.addEventListener("click", () => {
          state.mode = button.dataset.mode;
          render();
        });
      });
      el("singleDateInput").addEventListener("change", event => {
        state.singleDate = event.target.value;
        render();
      });
      el("startDateInput").addEventListener("change", event => {
        state.startDate = event.target.value;
        render();
      });
      el("endDateInput").addEventListener("change", event => {
        state.endDate = event.target.value;
        render();
      });
      el("rankSelect").addEventListener("change", event => {
        state.rank = event.target.value;
        render();
      });
      for (const canvas of document.querySelectorAll("canvas")) {
        canvas.addEventListener("mousemove", handlePointerMove);
        canvas.addEventListener("mouseleave", handlePointerLeave);
        canvas.addEventListener("click", handleClick);
      }
      window.addEventListener("resize", render);
    }

    setDefaults();
    populateControls();
    bindControls();
    render();
  </script>
</body>
</html>
